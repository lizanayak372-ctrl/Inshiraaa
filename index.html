
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Runner 3D</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #080820;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}
h1 {
  color: #72f7ff;
  text-shadow: 0 0 15px #9b5cff;
}
#ui {
  position: fixed;
  top: 10px;
  width: 100%;
  z-index: 2;
  pointer-events: none;
}
#score { font-size: 22px; }
button {
  background: linear-gradient(90deg,#8b5cff,#00d9ff);
  color: white;
  border: 0;
  border-radius: 25px;
  padding: 12px 24px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
  pointer-events: auto;
}
#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-around;
  z-index: 3;
}
#message {
  position: fixed;
  top: 40%;
  width: 100%;
  z-index: 4;
}
</style>
</head>
<body>

<div id="ui">
  <h1>💎 Crystal Runner 3D</h1>
  <div id="score">Score: 0</div>
</div>

<div id="message">
  <h2 id="status">Ready to Run?</h2>
  <button onclick="startGame()">START GAME</button>
</div>

<div id="controls">
  <button onclick="move(-1)">⬅️</button>
  <button onclick="jump()">⬆️ JUMP</button>
  <button onclick="move(1)">➡️</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080820);
scene.fog = new THREE.Fog(0x080820, 15, 65);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth/innerHeight, 0.1, 100
);
camera.position.set(0, 5, 9);
camera.lookAt(0, 1, -5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9ebaff,0x241044,2));

const light = new THREE.PointLight(0x00ddff,40,40);
light.position.set(0,5,-5);
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10,100),
  new THREE.MeshStandardMaterial({
    color:0x171b3e,
    metalness:.5,
    roughness:.4
  })
);
floor.rotation.x=-Math.PI/2;
floor.position.z=-35;
scene.add(floor);

const grid = new THREE.GridHelper(100,50,0x8a5cff,0x244a85);
grid.position.set(0,.02,-35);
scene.add(grid);

// Player
const player = new THREE.Group();
scene.add(player);

const body = new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.2,.65),
  new THREE.MeshStandardMaterial({
    color:0x8855ff,
    emissive:0x301080,
    metalness:.5,
    roughness:.25
  })
);
body.position.y=.8;
player.add(body);

const visor = new THREE.Mesh(
  new THREE.BoxGeometry(.55,.2,.1),
  new THREE.MeshStandardMaterial({
    color:0x00ffff,
    emissive:0x00aaff
  })
);
visor.position.set(0,1,.36);
player.add(visor);

// Stars
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
for(let i=0;i<500;i++){
  starPositions.push(
    (Math.random()-.5)*80,
    Math.random()*25,
    -Math.random()*90
  );
}
starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPositions,3)
);
scene.add(new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({color:0xffffff,size:.13})
));

let objects=[];
let lane=0;
let score=0;
let running=false;
let jumping=false;
let jumpHeight=0;
let jumpVelocity=0;
let spawnTimer=0;
let speed=.22;

function spawn(){
  const x=[-2.5,0,2.5][Math.floor(Math.random()*3)];
  const crystal=Math.random()>.35;
  let object;

  if(crystal){
    object=new THREE.Mesh(
      new THREE.OctahedronGeometry(.4),
      new THREE.MeshStandardMaterial({
        color:0x65ffff,
        emissive:0x00bfff,
        emissiveIntensity:2,
        metalness:.7,
        roughness:.15
      })
    );
    object.position.set(x,1,-45);
    object.userData.type='crystal';
  }else{
    object=new THREE.Mesh(
      new THREE.BoxGeometry(1,1.5,1),
      new THREE.MeshStandardMaterial({
        color:0xff2255,
        emissive:0x990022
      })
    );
    object.position.set(x,.75,-45);
    object.userData.type='obstacle';
  }
  scene.add(object);
  objects.push(object);
}

function move(direction){
  if(running) lane=Math.max(-1,Math.min(1,lane+direction));
}

function jump(){
  if(running && !jumping){
    jumping=true;
    jumpVelocity=.22;
  }
}

function startGame(){
  objects.forEach(o=>scene.remove(o));
  objects=[];
  score=0;
  lane=0;
  speed=.22;
  spawnTimer=0;
  jumpHeight=0;
  jumpVelocity=0;
  jumping=false;
  player.position.set(0,0,2);
  document.getElementById('score').textContent='Score: 0';
  document.getElementById('status').textContent='';
  document.getElementById('message').style.display='none';
  running=true;
}

function endGame(){
  running=false;
  document.getElementById('status').textContent=
    'Game Over! Score: '+score;
  document.getElementById('message').style.display='block';
}

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);
  if(e.key==='ArrowUp'||e.key===' ')jump();
});

let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/16.67,2);
  last=now;

  if(running){
    spawnTimer+=dt;
    if(spawnTimer>65){
      spawn();
      spawnTimer=0;
    }

    speed=Math.min(.42,speed+.00005*dt);
    player.position.x+=(lane*2.5-player.position.x)*.15*dt;

    if(jumping){
      jumpVelocity-=.012*dt;
      jumpHeight+=jumpVelocity*dt;
      if(jumpHeight<=0){
        jumpHeight=0;
        jumping=false;
        jumpVelocity=0;
      }
    }
    player.position.y=jumpHeight;

    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      o.position.z+=speed*dt;
      if(o.userData.type==='crystal')o.rotation.y+=.06*dt;

      const close=Math.abs(o.position.z-player.position.z)<.8;
      const sameLane=Math.abs(o.position.x-player.position.x)<1;

      if(close&&sameLane){
        if(o.userData.type==='crystal'){
          score++;
          document.getElementById('score').textContent='Score: '+score;
          scene.remove(o);
          objects.splice(i,1);
          continue;
        }else if(jumpHeight<1.15){
          endGame();
          break;
        }
      }
      if(o.position.z>7){
        scene.remove(o);
        objects.splice(i,1);
      }
    }
  }

  camera.position.x+=(player.position.x*.2-camera.position.x)*.04;
  camera.lookAt(player.position.x*.15,1,-5);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
