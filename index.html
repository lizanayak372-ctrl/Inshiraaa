
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Highway Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8bc8ed;font-family:Arial,sans-serif;touch-action:none;color:white}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#142239e8;border:1px solid #ffffff66;border-radius:13px;padding:10px 13px;font-weight:bold}
#sound{position:fixed;top:65px;right:12px;padding:10px;border-radius:12px;background:#142239e8;color:white;border:1px solid #ffffff66}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 17px;align-items:center}
.ctrl{width:65px;height:58px;border:1px solid #ffffff99;border-radius:17px;background:#142239dd;color:white;font-size:24px;font-weight:bold;touch-action:none;user-select:none}
#jump{width:94px;background:#ffca28;color:#202a38;font-size:15px}
#hint{position:fixed;bottom:85px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101b99;padding:20px}
.card{width:min(370px,100%);padding:25px 20px;border-radius:24px;text-align:center;background:#172942;border:1px solid #ffffff55;box-shadow:0 15px 45px #0006}
h1{color:#ffd12f;margin:0 0 12px;font-size:30px}
p{line-height:1.55;color:#e4edf7}
.action{background:#ffd12f;color:#172033;border:0;padding:14px 24px;border-radius:13px;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="badge">🪙 <span id="coins">0</span></div>
 <div class="badge">SCORE: <span id="score">0</span></div>
</div>
<button id="sound">🔊 Sound ON</button>
<div id="hint">◀ ▶ CHANGE LANE • JUMP OVER POTHOLES</div>
<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="jump">⬆ JUMP</button>
 <button class="ctrl" id="right">▶</button>
</div>
<div id="overlay">
 <div class="card">
  <h1 id="title">HIGHWAY RUSH</h1>
  <p id="description">🏃 Run on an Indian countryside highway!<br>🪙 Collect golden coins.<br>🕳️ Jump over potholes and dodge rocks.</p>
  <button class="action" id="play">START GAME ▶</button>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,D=1;
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);resize();

let running=false,over=false,soundOn=true,audio;
let lane=1,visualLane=1,jumpY=0,jumpVelocity=0;
let objects=[],clock=0,elapsed=0,score=0,coins=0,speed=.30,world=0,last=0;

function tone(f=600,d=.12,type='sine',end){
 if(!soundOn)return;
 try{
  audio ||= new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  let o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);
  if(end)o.frequency.exponentialRampToValueAtTime(end,audio.currentTime+d);
  g.gain.setValueAtTime(.07,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d);
 }catch(e){}
}
function coinSound(){tone(760,.09,'sine',1150);setTimeout(()=>tone(1100,.12,'sine',1450),70)}
$('sound').onclick=()=>{
 soundOn=!soundOn;
 $('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';
 if(soundOn)tone(650);
};

// Perspective: objects begin far away and grow as they approach.
const horizon=()=>H*.30;
function roadWidth(y){
 let t=Math.max(0,Math.min(1,(y-horizon())/(H*.80)));
 return W*(.13+.91*t);
}
function project(l,z){
 let p=Math.max(0,Math.min(1,z));
 let y=horizon()+p*p*(H*.80);
 let width=roadWidth(y);
 return {x:W/2+(l-1)*width/3,y,width,s:.10+p*1.18};
}
function poly(points,fill,stroke){
 ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}
}

function scenery(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#70c5fa');g.addColorStop(.52,'#d7edfa');g.addColorStop(1,'#c5d59a');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Distant Indian countryside hills
 poly([[0,H*.40],[W*.12,H*.26],[W*.25,H*.37],[W*.43,H*.22],[W*.61,H*.37],[W*.82,H*.23],[W,H*.37],[W,H*.55],[0,H*.55]],'#9bb7a1');
 poly([[0,H*.45],[W*.2,H*.34],[W*.39,H*.44],[W*.58,H*.32],[W*.78,H*.43],[W,H*.34],[W,H*.58],[0,H*.58]],'#6b9b62');
 ctx.fillStyle='#47814b';ctx.fillRect(0,H*.48,W,H*.52);

 // Fields
 for(let i=0;i<9;i++){
  let y=H*.52+i*H*.065;
  ctx.strokeStyle=i%2?'#63974d':'#83a95a';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W*.38,y+H*.03);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,y);ctx.lineTo(W*.62,y+H*.03);ctx.stroke();
 }

 // Road and shoulders
 let ty=horizon(),by=H*1.10,tw=roadWidth(ty),bw=roadWidth(H);
 poly([[W/2-tw/2,ty],[W/2+tw/2,ty],[W/2+bw/2,by],[W/2-bw/2,by]],'#4b4c4b');
 poly([[W/2-tw/2,ty],[W/2-tw/2+3,ty],[W/2-bw/2+5,by],[W/2-bw/2,by]],'#eee3c7');
 poly([[W/2+tw/2-3,ty],[W/2+tw/2,ty],[W/2+bw/2,by],[W/2+bw/2-5,by]],'#eee3c7');

 // Three lanes: two dashed dividing lines
 for(let i=0;i<17;i++){
  let z=((i/17+world*.76)%1);
  let y=ty+z*z*(H*.80),rw=roadWidth(y);
  let dash=3+z*24;
  ctx.fillStyle='#fff1ce';
  for(let side of [-1,1]){
   ctx.fillRect(W/2+side*rw/6-1,y,Math.max(2,z*3),dash);
  }
 }

 // Roadside trees moving slowly to imply forward travel
 for(let i=0;i<17;i++){
  let z=((i/17+world*.19)%1);
  let y=ty+z*z*(H*.85);
  let rw=roadWidth(y);
  let size=5+z*25;
  for(let side of [-1,1]){
   let x=W/2+side*(rw/2+size*1.8);
   ctx.fillStyle='#60472e';
   ctx.fillRect(x-size*.14,y-size*.45,size*.28,size*.7);
   ctx.fillStyle=i%2?'#286744':'#347c48';
   ctx.beginPath();ctx.arc(x,y-size*.6,size*.65,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(x-size*.3,y-size*.85,size*.45,0,Math.PI*2);ctx.fill();
  }
 }
}

function coin(o){
 let p=project(o.lane,o.z),r=10*p.s,x=p.x,y=p.y-20*p.s;
 ctx.save();ctx.translate(x,y);
 ctx.shadowColor='#ffd629';ctx.shadowBlur=14*p.s;
 ctx.fillStyle='#ffc928';ctx.beginPath();
 ctx.ellipse(0,0,r,r*1.25,0,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff3a1';ctx.lineWidth=2*p.s;ctx.stroke();
 ctx.fillStyle='#fff7cb';ctx.font=`bold ${Math.max(8,13*p.s)}px Arial`;
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,0);
 ctx.restore();
}

function rock(o){
 let p=project(o.lane,o.z),s=p.s,x=p.x,y=p.y;
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y,25*s,8*s,0,0,Math.PI*2);ctx.fill();
 poly([[x-24*s,y],[x-21*s,y-16*s],[x-9*s,y-31*s],
 [x+7*s,y-35*s],[x+24*s,y-17*s],[x+27*s,y]],'#737a7b','#444949');
 poly([[x-21*s,y-16*s],[x-9*s,y-31*s],[x+7*s,y-35*s],
 [x+1*s,y-22*s],[x-10*s,y-20*s]],'#b5b7ad');
 poly([[x-10*s,y-20*s],[x+1*s,y-22*s],[x+13*s,y-12*s],[x+5*s,y-4*s]],'#8f9692');
}

function pothole(o){
 let p=project(o.lane,o.z),s=p.s,x=p.x,y=p.y;
 // Irregular broken asphalt rim
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#282d2d';
 ctx.beginPath();
 ctx.moveTo(-31*s,-3*s);ctx.lineTo(-24*s,-12*s);
 ctx.lineTo(-10*s,-15*s);ctx.lineTo(2*s,-12*s);
 ctx.lineTo(20*s,-14*s);ctx.lineTo(31*s,-4*s);
 ctx.lineTo(25*s,7*s);ctx.lineTo(9*s,11*s);
 ctx.lineTo(-7*s,8*s);ctx.lineTo(-24*s,8*s);ctx.closePath();ctx.fill();
 // Deep interior
 let g=ctx.createLinearGradient(0,-13*s,0,10*s);
 g.addColorStop(0,'#171b1d');g.addColorStop(1,'#050809');
 ctx.fillStyle=g;ctx.beginPath();
 ctx.ellipse(0,-2*s,22*s,8*s,-.08,0,Math.PI*2);ctx.fill();
 // Exposed broken asphalt edge
 ctx.strokeStyle='#aaa69a';ctx.lineWidth=2*s;
 ctx.beginPath();ctx.ellipse(-1*s,-4*s,25*s,9*s,-.08,Math.PI*.08,Math.PI*1.95);ctx.stroke();
 // Small gravel around the hole
 ctx.fillStyle='#b1a99a';
 for(let i=0;i<4;i++){
  ctx.beginPath();ctx.arc((-22+i*13)*s,(9+(i%2)*2)*s,1.7*s,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}

// More natural-looking cartoon runner: head, hair, body, clothes, limbs and shoes.
function runner(){
 let ground=H*.78;
 let x=project(playerLane,1).x;
 let y=ground-jumpY;
 let scale=Math.min(W/390,H/700)*1.12;
 let stride=running?Math.sin(world*16)*9:0;
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);

 // Ground shadow shrinks visually while jumping
 ctx.fillStyle='rgba(0,0,0,.30)';
 ctx.beginPath();ctx.ellipse(0,30+jumpY*.2,24-jumpY*.012,7,0,0,Math.PI*2);ctx.fill();

 // Legs and sneakers
 ctx.lineCap='round';ctx.lineWidth=10;ctx.strokeStyle='#222936';
 ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-11+stride,25);ctx.stroke();
 ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(11-stride,25);ctx.stroke();
 ctx.strokeStyle='#e8edf0';ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(-11+stride,26);ctx.lineTo(-1+stride,27);ctx.stroke();
 ctx.beginPath();ctx.moveTo(11-stride,26);ctx.lineTo(21-stride,27);ctx.stroke();

 // Jacket / hoodie
 poly([[-13,-31],[-19,-8],[-13,4],[13,4],[19,-8],[13,-31]],'#2457a0');
 ctx.strokeStyle='#1a3d70';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,1);ctx.stroke();

 // Arms
 ctx.strokeStyle='#2457a0';ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(-13,-25);ctx.lineTo(-20-stride*.35,-9);ctx.stroke();
 ctx.beginPath();ctx.moveTo(13,-25);ctx.lineTo(20+stride*.35,-9);ctx.stroke();
 ctx.fillStyle='#b97955';
 ctx.beginPath();ctx.arc(-20-stride*.35,-8,4,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(20+stride*.35,-8,4,0,Math.PI*2);ctx.fill();

 // Neck and face
 ctx.fillStyle='#bd805b';ctx.fillRect(-4,-38,8,9);
 ctx.fillStyle='#c98a62';ctx.beginPath();ctx.ellipse(0,-46,11,13,0,0,Math.PI*2);ctx.fill();

 // Hair
 ctx.fillStyle='#241d1a';ctx.beginPath();
 ctx.moveTo(-11,-46);ctx.quadraticCurveTo(-15,-62,0,-61);
 ctx.quadraticCurveTo(15,-61,11,-44);
 ctx.lineTo(5,-49);ctx.lineTo(0,-46);ctx.lineTo(-5,-49);
 ctx.closePath();ctx.fill();

 // Ear and facial features in side profile
 ctx.fillStyle='#aa6849';ctx.beginPath();ctx.arc(9,-45,2.5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#362a24';ctx.beginPath();ctx.arc(7,-48,1.3,0,Math.PI*2);ctx.fill();

 ctx.restore();
}

function spawn(){
 let l=Math.floor(Math.random()*3),r=Math.random();
 if(r<.50){
  for(let i=0;i<4;i++)objects.push({type:'coin',lane:l,z:-i*.10,done:false});
 }else{
  objects.push({type:r<.76?'rock':'pit',lane:l,z:0,done:false});
 }
}

function update(dt){
 if(!running||over)return;
 elapsed+=dt;world+=dt*2.5;
 speed=Math.min(.58,.30+elapsed*.002);
 clock-=dt;
 if(clock<=0){spawn();clock=1.0+Math.random()*.35;}

 // Jump physics: positive velocity lifts the player; gravity brings them back.
 if(jumpY>0||jumpVelocity>0){
  jumpY+=jumpVelocity*dt*60;
  jumpVelocity-=.021*dt*60;
  if(jumpY<=0){jumpY=0;jumpVelocity=0;}
 }
 visualLane+=(lane-visualLane)*Math.min(1,dt*12);

 for(let o of objects){
  o.z+=speed*dt;
  if(o.z>=.87&&!o.done&&o.z<1.03&&o.lane===lane){
   if(o.type==='coin'){
    o.done=true;coins++;score+=10;coinSound();
   }else if(o.type==='pit'&&jumpY>35){
    o.done=true;score+=5;
   }else{
    o.done=true;endGame();break;
   }
  }
 }
 objects=objects.filter(o=>o.z<1.12&&!o.done);
 score+=Math.floor(dt*10);
 $('score').textContent=score;
 $('coins').textContent=coins;
}

function endGame(){
 running=false;over=true;
 tone(170,.3,'sawtooth',55);
 $('title').textContent='GAME OVER!';
 $('description').innerHTML='🏁 Score: <b>'+score+'</b><br>🪙 Coins: <b>'+coins+'</b><br>Ready for another run?';
 $('play').textContent='RESTART ↻';
 $('overlay').style.display='flex';
}

function startGame(){
 try{
  audio ||= new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
 }catch(e){}
 tone(500,.1);
 lane=1;visualLane=1;jumpY=0;jumpVelocity=0;
 objects=[];elapsed=0;score=0;coins=0;
 speed=.30;world=0;clock=.7;over=false;running=true;
 $('coins').textContent='0';$('score').textContent='0';
 $('title').textContent='HIGHWAY RUSH';
 $('description').innerHTML='Run on the countryside highway!<br>Collect coins, dodge rocks and jump over potholes.';
 $('play').textContent='START GAME ▶';
 $('overlay').style.display='none';
 last=performance.now();
}

function left(){if(running)lane=Math.max(0,lane-1);}
function right(){if(running)lane=Math.min(2,lane+1);}
function doJump(){
 if(!running||jumpY>0||jumpVelocity>0)return;
 jumpVelocity=.42;
 tone(270,.16,'triangle',520);
}
$('left').addEventListener('pointerdown',e=>{e.preventDefault();left();});
$('right').addEventListener('pointerdown',e=>{e.preventDefault();right();});
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();doJump();});
$('play').addEventListener('click',startGame);

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')left();
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')right();
 if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W'){e.preventDefault();doJump();}
});

let touchStart=null;
canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{
 if(!touchStart)return;
 let dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
 if(Math.abs(dx)>25){dx<0?left():right();}
 else if(dy<-20)doJump();
 touchStart=null;
});

function frame(t){
 let dt=Math.min(.04,Math.max(0,(t-last)/1000||0));
 last=t;
 scenery();
 objects.sort((a,b)=>a.z-b.z);
 for(let o of objects){
  if(o.z<0)continue;
  if(o.type==='coin')coin(o);
  else if(o.type==='rock')rock(o);
  else pothole(o);
 }
 runner();
 update(dt);
 requestAnimationFrame(frame);
}
last=performance.now();
requestAnimationFrame(frame);
</script>
</body>
 </html>
