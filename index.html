
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101827;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:15px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:#101827d9;border:1px solid #ffffff55;border-radius:14px;padding:10px 14px;font-weight:bold;box-shadow:0 4px 15px #0005}
#score{font-size:20px}
#coins{color:#ffdc35}
#sound{position:fixed;top:90px;right:15px;background:#152033dd;color:white;border:1px solid #ffffff55;border-radius:12px;padding:10px 14px;font-size:16px}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101b99;text-align:center}
.card{width:min(88%,370px);padding:27px 20px;background:#17243a;border:1px solid #ffffff44;border-radius:24px;box-shadow:0 15px 60px #0008}
h1{margin:0 0 8px;color:#ffdc35;font-size:32px}
p{line-height:1.5;color:#e4eaf5}
button{cursor:pointer;border:0;border-radius:13px;padding:13px 20px;background:#ffca28;color:#1a2435;font-size:17px;font-weight:bold}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:65px;height:62px;border-radius:18px;background:#101827b9;color:white;border:1px solid #ffffff77;font-size:26px;touch-action:none}
#jump{width:86px;background:#ffca28;color:#192234}
#hint{position:fixed;bottom:100px;left:0;right:0;text-align:center;font-size:12px;color:#ffffffb9;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">🪙 <span id="coins">0</span></div>
  <div class="panel">SCORE <span id="score">0</span></div>
</div>
<button id="sound">🔊 Sound ON</button>

<div id="hint">Swipe or use buttons to move • Jump over obstacles!</div>
<div id="controls">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="jump">⬆ JUMP</button>
  <button class="ctrl" id="right">▶</button>
</div>

<div id="message">
 <div class="card">
  <h1>ROAD RUNNER</h1>
  <p>🏃 Run along the road!<br>🪙 Collect the golden coins.<br>🪨 Dodge rocks and jump over potholes.<br>🔊 Turn on sound for game effects!</p>
  <button id="start">START RUNNING ▶</button>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

let W,H,sky;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+'px';
 canvas.style.height=innerHeight+'px';
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize);resize();

let running=false,gameOver=false,soundOn=true,audio=null;
let lane=0,playerX=0,jumpY=0,jumpV=0,score=0,coins=0;
let speed=0.34,world=0,objects=[],spawnTimer=0,last=0;
let swipeX=null,swipeY=null;

function audioStart(){
 if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
}
function tone(freq,dur,type='sine',vol=0.07,endFreq=null){
 if(!soundOn)return;
 try{
  audioStart();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,audio.currentTime+dur);
  g.gain.setValueAtTime(vol,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
 }catch(e){}
}
function coinSound(){tone(700,.09,'sine',.08,1050);setTimeout(()=>tone(1100,.12,'sine',.06,1450),65)}
function hitSound(){tone(180,.32,'sawtooth',.09,55)}
function jumpSound(){tone(260,.16,'triangle',.06,520)}
function startSound(){tone(440,.1);setTimeout(()=>tone(660,.13),100)}

$('sound').onclick=()=>{
 soundOn=!soundOn;
 $('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';
 if(soundOn){audioStart();tone(700,.1)}
};

function roadY(){return H*.34}
function horizon(){return H*.31}
function roadHalf(y){return 30+(y-horizon())*.72}
function roadX(y){return W/2}
function project(laneNo,z){
 const p=1-z;
 const y=horizon()+p*p*(H*.83);
 const half=roadHalf(y);
 return {x:W/2+laneNo*half*.57,y,scale:.12+p*1.05};
}
function poly(points,fill,stroke=null){
 ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#62b8f5');g.addColorStop(.58,'#f9c68b');g.addColorStop(1,'#c9d9bf');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // sun
 ctx.fillStyle='#fff0a8';ctx.beginPath();ctx.arc(W*.78,H*.15,Math.min(W,H)*.055,0,Math.PI*2);ctx.fill();

 // distant mountains
 poly([[0,H*.42],[W*.1,H*.23],[W*.21,H*.36],[W*.34,H*.18],[W*.48,H*.37],[W*.65,H*.2],[W*.83,H*.35],[W,H*.19],[W,H*.48],[0,H*.48]],'#7a9eaa');
 poly([[0,H*.46],[W*.16,H*.32],[W*.29,H*.43],[W*.45,H*.28],[W*.61,H*.43],[W*.81,H*.3],[W,H*.43],[W,H*.55],[0,H*.55]],'#547e69');

 // hills / trees
 ctx.fillStyle='#315f48';ctx.fillRect(0,H*.43,W,H*.16);
 for(let i=0;i<24;i++){
  let x=(i*113+world*9)%(W+70)-35;
  let y=H*.44+(i%4)*H*.018;
  ctx.fillStyle=i%2?'#1e563d':'#3c7950';
  poly([[x-22,y+30],[x,y-35-(i%3)*12],[x+22,y+30]],ctx.fillStyle);
 }
 // road
 poly([[W*.43,horizon()],[W*.57,horizon()],[W*1.07,H],[W*-.07,H]],'#454b54');
 poly([[W*.425,horizon()],[W*.43,horizon()],[W*.03,H],[0,H]],'#d5d5c9');
 poly([[W*.57,horizon()],[W*.575,horizon()],[W,H],[W*.97,H]],'#d5d5c9');

 // lane separators scrolling into distance
 for(let i=0;i<14;i++){
  const z=((i/14+world*.8)%1);
  const y=horizon()+z*z*(H*.8);
  const half=roadHalf(y);
  const dashH=4+z*30;
  for(const l of [-1/3,1/3]){
   ctx.fillStyle='#ffffffcc';
   ctx.fillRect(W/2+l*half*2,y,Math.max(1,z*4),dashH);
  }
 }
}
function drawCoin(o){
 const p=project(o.lane,o.z),s=p.scale;
 const r=11*s;
 ctx.save();ctx.translate(p.x,p.y-20*s);
 ctx.shadowColor='#ffd52b';ctx.shadowBlur=16*s;
 ctx.fillStyle='#ffca22';ctx.beginPath();ctx.ellipse(0,0,r,r*1.25,0,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff2a0';ctx.lineWidth=2*s;ctx.stroke();
 ctx.fillStyle='#fff6b7';ctx.font=`bold ${Math.max(8,14*s)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,0);
 ctx.restore();
}
function drawRock(o){
 const p=project(o.lane,o.z),s=p.scale;
 const x=p.x,y=p.y;
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,0,27*s,8*s,0,0,Math.PI*2);ctx.fill();
 poly([[-25*s,-4*s],[-19*s,-27*s],[-4*s,-39*s],[17*s,-30*s],[28*s,-9*s],[21*s,0],[-20*s,0]],'#777d83','#454b52');
 poly([[-19*s,-27*s],[-4*s,-39*s],[17*s,-30*s],[4*s,-23*s],[-7*s,-24*s]],'#aeb4b8');
 ctx.restore();
}
function drawPit(o){
 const p=project(o.lane,o.z),s=p.scale;
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle='#28282c';ctx.beginPath();ctx.ellipse(0,0,35*s,14*s,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#17191d';ctx.lineWidth=4*s;ctx.stroke();
 ctx.strokeStyle='#77716a';ctx.lineWidth=2*s;
 ctx.beginPath();ctx.ellipse(0,-1*s,26*s,8*s,0,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
function drawBoy(){
 const ground=H*.79;
 const x=W/2+playerX*W*.19;
 const y=ground-jumpY;
 const bob=running&&!gameOver?Math.sin(world*20)*3:0;
 const s=Math.min(W/390,H/700)*1.1;
 ctx.save();ctx.translate(x,y+bob);ctx.scale(s,s);

 // shadow
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,jumpY>0?jumpY+27:28,26,9,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.strokeStyle='#202532';ctx.lineWidth=12;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(-13+Math.sin(world*17)*6,32);ctx.stroke();
 ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(14-Math.sin(world*17)*6,32);ctx.stroke();
 // shoes
 ctx.strokeStyle='#f2f2f2';ctx.lineWidth=9;
 ctx.beginPath();ctx.moveTo(-13+Math.sin(world*17)*6,33);ctx.lineTo(-3+Math.sin(world*17)*6,34);ctx.stroke();
 ctx.beginPath();ctx.moveTo(14-Math.sin(world*17)*6,33);ctx.lineTo(23-Math.sin(world*17)*6,34);ctx.stroke();
 // hoodie
 poly([[-17,-29],[-23,3],[-12,10],[12,10],[23,3],[17,-29]],'#263d68');
 // hood
 ctx.fillStyle='#d8e0e9';ctx.beginPath();ctx.ellipse(0,-28,13,14,0,0,Math.PI*2);ctx.fill();
 // head
 ctx.fillStyle='#bd805b';ctx.beginPath();ctx.arc(0,-45,13,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle='#28201d';ctx.beginPath();ctx.arc(0,-49,14,Math.PI,Math.PI*2);ctx.lineTo(13,-43);ctx.lineTo(6,-46);ctx.lineTo(1,-42);ctx.lineTo(-5,-46);ctx.lineTo(-12,-42);ctx.closePath();ctx.fill();
 // arms
 ctx.strokeStyle='#263d68';ctx.lineWidth=9;
 ctx.beginPath();ctx.moveTo(-16,-25);ctx.lineTo(-25+Math.sin(world*15)*4,-7);ctx.stroke();
 ctx.beginPath();ctx.moveTo(16,-25);ctx.lineTo(25-Math.sin(world*15)*4,-7);ctx.stroke();
 ctx.restore();
}
function spawn(){
 const laneNo=[-1,0,1][Math.floor(Math.random()*3)];
 const r=Math.random();
 if(r<.42){
  // coin trails
  for(let i=0;i<4;i++)objects.push({type:'coin',lane:laneNo,z:-i*.12});
 }else{
  objects.push({type:r<.72?'rock':'pit',lane:laneNo,z:0});
 }
}
function update(dt){
 if(!running||gameOver)return;
 world+=dt*speed*2.5;
 speed=Math.min(.7,speed+dt*.003);
 spawnTimer-=dt;
 if(spawnTimer<=0){spawn();spawnTimer=.8+Math.random()*.7}
 if(jumpY>0||jumpV>0){
  jumpY+=jumpV*dt*60;jumpV-=.018*dt*60;
  if(jumpY<=0){jumpY=0;jumpV=0}
 }
 playerX+=(lane-playerX)*Math.min(1,dt*12);

 for(const o of objects){
  o.z+=dt*speed;
  if(o.z>.86&&!o.done&&Math.abs(o.lane-playerX)<.47){
   if(o.type==='coin'){coins++;score+=10;o.done=true;coinSound()}
   else if(o.z<.99){
    if(o.type==='pit'&&jumpY>25){o.done=true;score+=5}
    else if(o.type==='rock'||o.type==='pit'){
     o.done=true;hitSound();gameOver=true;running=false;showEnd();
    }
   }
  }
 }
 objects=objects.filter(o=>o.z<1.12&&!o.done);
 score+=Math.floor(dt*10);
 $('score').textContent=score;
 $('coins').textContent=coins;
}
function showEnd(){
 $('message').style.display='flex';
 $('message').innerHTML=`<div class="card"><h1>${gameOver?'OOPS!':'ROAD RUNNER'}</h1><p>🏁 Score: <b>${score}</b><br>🪙 Coins collected: <b>${coins}</b><br>Try again and beat your best run!</p><button id="start">PLAY AGAIN ↻</button></div>`;
 $('start').onclick=begin;
}
function begin(){
 audioStart();startSound();
 lane=0;playerX=0;jumpY=0;jumpV=0;
 score=0;coins=0;speed=.34;world=0;objects=[];spawnTimer=.4;
 gameOver=false;running=true;
 $('message').style.display='none';
 last=performance.now();
}
$('start').onclick=begin;
function moveLeft(){if(running&&!gameOver)lane=Math.max(-1,lane-1)}
function moveRight(){if(running&&!gameOver)lane=Math.min(1,lane+1)}
function jump(){if(running&&!gameOver&&jumpY===0){jumpV=.34;jumpSound()}}
$('left').onpointerdown=e=>{e.preventDefault();moveLeft()};
$('right').onpointerdown=e=>{e.preventDefault();moveRight()};
$('jump').onpointerdown=e=>{e.preventDefault();jump()};
addEventListener('keydown',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))moveLeft();
 if(['ArrowRight','d','D'].includes(e.key))moveRight();
 if(['ArrowUp',' ','w','W'].includes(e.key))jump();
});
canvas.addEventListener('pointerdown',e=>{swipeX=e.clientX;swipeY=e.clientY});
canvas.addEventListener('pointerup',e=>{
 if(swipeX===null)return;
 const dx=e.clientX-swipeX,dy=e.clientY-swipeY;
 if(Math.abs(dx)>25){dx<0?moveLeft():moveRight()}
 else if(dy<-20)jump();
 swipeX=swipeY=null;
});
function frame(t){
 const dt=Math.min(.04,(t-last)/1000||0);last=t;
 drawBackground();
 // objects in depth order
 objects.sort((a,b)=>a.z-b.z);
 for(const o of objects){
  if(o.z<0)continue;
  if(o.type==='coin')drawCoin(o);
  else if(o.type==='rock')drawRock(o);
  else drawPit(o);
 }
 drawBoy();update(dt);
 requestAnimationFrame(frame);
}
last=performance.now();requestAnimationFrame(frame);
</script>
</body>
</html>
